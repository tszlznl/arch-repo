name: build-repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm git go ffmpeg zstd libarchive sudo

      - name: Setup non-root build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: Build packages
        run: |
          mkdir -p x86_64
          REPO_DIR="$(pwd)/x86_64"

          for pkg_dir in packages/*; do
            if [ -d "$pkg_dir" ] && [ -f "$pkg_dir/PKGBUILD" ]; then
              echo "Building: $pkg_dir"
              su builder -c "cd '$pkg_dir' && makepkg -s --noconfirm" || true
              cp $pkg_dir/*.pkg.tar.zst "$REPO_DIR/" || true
            fi
          done

      - name: Create repository db
        run: |
          cd x86_64
          repo-add tszlznl.db.tar.gz *.pkg.tar.zst
          cp tszlznl.db.tar.gz tszlznl.db
          cp tszlznl.files.tar.gz tszlznl.files
          cd ..

      - name: Deploy to gh-pages branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          rm -rf /tmp/deploy
          mkdir -p /tmp/deploy/x86_64
          cp -r x86_64/* /tmp/deploy/x86_64/

          cat > /tmp/deploy/index.html << 'INDEXEOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>tszlznl Arch Linux Repository</title>
          </head>
          <body>
            <h1>tszlznl Personal Arch Linux Repository</h1>
            <p>Add to /etc/pacman.conf:</p>
            <pre>[tszlznl]
SigLevel = Optional TrustAll
Server = https://tszlznl.github.io/arch-repo/$arch</pre>
          </body>
          </html>
INDEXEOF

          git checkout --orphan gh-pages
          git rm -rf .
          cp -r /tmp/deploy/* .
          git add .
          git commit -m "Deploy repository database and packages [skip ci]"
          git push --force origin gh-pages
