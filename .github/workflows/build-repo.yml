name: build-repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build packages script
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace archlinux:base-devel bash -c "
            set -euo pipefail
            pacman-key --init
            pacman-key --populate archlinux
            pacman -Syu --noconfirm git go ffmpeg zstd libarchive sudo

            useradd -m builder
            echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
            chown -R builder:builder /workspace

            mkdir -p /workspace/x86_64
            for pkg_dir in packages/*; do
              if [ -d \"\$pkg_dir\" ] && [ -f \"\$pkg_dir/PKGBUILD\" ]; then
                echo \"Building: \$pkg_dir\"
                su builder -c \"cd /workspace/\$pkg_dir && makepkg -s --noconfirm\" || true
                cp /workspace/\$pkg_dir/*.pkg.tar.zst /workspace/x86_64/ || true
              fi
            done

            cd /workspace/x86_64
            repo-add tszlznl.db.tar.gz *.pkg.tar.zst
          "

      - name: Restore permissions for runner
        run: |
          sudo chown -R $USER:$USER "$GITHUB_WORKSPACE"

      - name: Create or Update GitHub Release for Pacman Repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete repo -y --cleanup-tag 2>/dev/null || true
          gh release create repo x86_64/* \
            --title "tszlznl Arch Repository Database & Packages" \
            --notes "Automated build of packages and repo database"
